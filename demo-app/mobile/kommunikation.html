<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kommunikation</title>
<meta name="theme-color" content="#2E5E4E">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="phone-wrap">
  <div class="phone">
    <div class="phone-header" style="display:flex; align-items:center; gap:12px;">
      <a href="angehoerige.html" style="color:#6B7280;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <div>
        <div style="font-size:14.5px; font-weight:700;">Frieda Albrecht</div>
        <div style="font-size:11.5px; color:#6B7280;">Sabine Meyer · Pflegedienst Nord · Martina Albrecht</div>
      </div>
    </div>

    <div class="phone-body" id="messages" style="padding:18px 16px;"></div>

    <div style="padding:12px 16px 20px; background:#fff; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center;">
      <input id="draft" type="text" placeholder="Nachricht schreiben …" style="flex-grow:1; height:44px; border:1px solid #D1D5DB; border-radius:999px; padding:0 16px; font-size:13.5px;"/>
      <div id="send-btn" style="width:44px; height:44px; border-radius:999px; background:var(--brand); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:#fff;">➤</div>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  const colors = {
    fachkraft: { bg: "var(--brand-light)", fg: "#1F2937", badge: "#2E5E4E" },
    pflege: { bg: "#E9EEF7", fg: "#1F2937", badge: "#3555A0" },
    angehoerige: { bg: "#2E5E4E", fg: "#FFFFFF", badge: "#2E5E4E" },
  };
  let messages = [
    { sender: "Pflegedienst Nord", text: "Appetit heute deutlich schlechter, kaum Mittagessen gegessen.", self: false, role: "pflege" },
    { sender: "Sabine Meyer", text: "Danke für die Meldung. Ich habe den Plan angepasst und komme Freitag vorbei.", self: false, role: "fachkraft" },
    { sender: "Martina Albrecht", text: "Können wir diese Woche kurz telefonieren?", self: true, role: "angehoerige" },
  ];

  function render() {
    qs("#messages").innerHTML = messages.map((m, i) => {
      const c = colors[m.role];
      return `<div style="display:flex; flex-direction:column; align-items:${m.self ? "flex-end" : "flex-start"}; margin-bottom:12px;">
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; padding:0 4px;">
          <span style="font-size:11px; font-weight:700; color:${c.badge};">${m.sender}</span>
          <span style="font-size:10.5px; color:#9CA3AF;">${9 + i}:1${i}</span>
        </div>
        <div style="max-width:78%; background:${m.self ? c.badge : c.bg}; color:${m.self ? "#FFFFFF" : c.fg}; border-radius:14px; padding:10px 14px; font-size:13.5px; line-height:1.45;">${m.text}</div>
      </div>`;
    }).join("");
    qs("#messages").scrollTop = qs("#messages").scrollHeight;
  }

  function send() {
    const text = qs("#draft").value.trim();
    if (!text) return;
    messages.push({ sender: "Martina Albrecht", text, self: true, role: "angehoerige" });
    qs("#draft").value = "";
    render();
  }
  qs("#send-btn").addEventListener("click", send);
  qs("#draft").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  render();
</script>
</body>
</html>
